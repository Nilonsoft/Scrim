<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e2330"/>
      <stop offset="60%" stop-color="#0e1117"/>
      <stop offset="100%" stop-color="#06070a"/>
    </radialGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Outer Ambient Radio Waves -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#neonGrad)" stroke-width="4" stroke-opacity="0.25" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="155" fill="none" stroke="url(#neonGrad)" stroke-width="6" stroke-opacity="0.4"/>

  <!-- Central Disc -->
  <circle cx="256" cy="256" r="120" fill="#12161f" stroke="url(#ringGrad)" stroke-width="8" filter="url(#glow)"/>

  <!-- Equalizer Pulse Bars in Center -->
  <g fill="url(#neonGrad)">
    <rect x="196" y="230" width="14" height="52" rx="7"/>
    <rect x="226" y="196" width="14" height="120" rx="7"/>
    <rect x="256" y="170" width="14" height="172" rx="7"/>
    <rect x="286" y="210" width="14" height="92" rx="7"/>
    <rect x="316" y="238" width="14" height="36" rx="7"/>
  </g>

  <!-- Transmitter Antenna Dot -->
  <circle cx="256" cy="140" r="10" fill="#00d2ff" filter="url(#glow)"/>
</svg>
